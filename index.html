<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1E5AA0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Despachos CBN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{ --azul:#1E5AA0; --negro:#141413; --bg:#EEF2F9; --txt:#0F172A; --mut:#64748B; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:Inter,sans-serif; background:var(--bg); color:var(--txt); }
  header{ background:var(--azul); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:5; }
  .logo{ width:40px; height:40px; border-radius:10px; background:#fff; color:var(--azul); font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; letter-spacing:.5px; }
  header .t{ font-size:18px; font-weight:800; }
  header .chip{ margin-left:auto; font-size:12px; font-weight:700; background:rgba(255,255,255,.16); padding:6px 10px; border-radius:9px; }
  main{ padding:18px; max-width:520px; margin:0 auto; }
  .vista{ display:none; } .vista.activa{ display:block; }
  h2{ font-size:20px; margin:4px 0 16px; }
  label{ font-size:13px; font-weight:600; color:var(--mut); display:block; margin:14px 0 6px; }
  select,input{ width:100%; height:52px; border:1.5px solid #D5DEEC; border-radius:13px; padding:0 14px; font-size:16px; font-weight:600; color:var(--txt); background:#F8FAFD; font-family:inherit; }
  .card{ background:#fff; border-radius:16px; padding:16px; box-shadow:0 4px 16px rgba(15,23,42,.06); }
  button{ font-family:inherit; cursor:pointer; border:none; }
  .btn{ width:100%; height:56px; border-radius:14px; font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn.azul{ background:var(--azul); color:#fff; } .btn.negro{ background:var(--negro); color:#fff; height:74px; font-size:18px; }
  .btn.verde{ background:#15803D; color:#fff; } .btn.ghost{ background:transparent; color:var(--azul); height:44px; font-weight:700; }
  .btn.gris{ background:#F1F5F9; color:#334155; } .btn.sm{ height:46px; font-size:14px; }
  .btn:disabled{ opacity:.5; }
  .mt{ margin-top:14px; }
  #reader{ display:none; width:100%; border-radius:14px; overflow:hidden; margin-top:14px; background:#000; }
  .stat{ background:#fff; border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:14px; box-shadow:0 4px 14px rgba(15,23,42,.05); margin-top:14px; }
  .stat .n{ font-size:30px; font-weight:800; color:var(--azul); min-width:44px; text-align:center; }
  .stat .l{ font-size:14px; font-weight:700; } .stat .s{ font-size:12px; color:var(--mut); font-weight:500; }
  .hdr{ font-size:12px; font-weight:700; color:var(--mut); letter-spacing:.4px; margin:18px 0 8px; }
  .item{ background:#fff; border-radius:13px; padding:12px 14px; display:flex; align-items:center; gap:12px; box-shadow:0 3px 10px rgba(15,23,42,.05); margin-bottom:9px; }
  .item .badge{ width:34px; height:34px; border-radius:10px; background:#FCEFD4; color:#9A6B12; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .item .cod{ flex:1; font-weight:700; font-variant-numeric:tabular-nums; }
  .item .x{ width:32px; height:32px; border-radius:9px; background:#F1F5F9; color:#94A3B8; font-size:14px; }
  .rrow{ display:flex; justify-content:space-between; padding:11px 14px; border-bottom:1px solid #EDF1F7; font-size:14px; }
  .rrow b{ color:var(--azul); font-variant-numeric:tabular-nums; }
  .ok{ background:#DCFCE7; border:1.5px solid #86EFAC; color:#166534; border-radius:13px; padding:12px 14px; font-weight:700; font-size:13.5px; margin-top:14px; }
  .barra{ position:sticky; bottom:0; background:var(--bg); padding:14px 0 6px; }
  .modal{ display:none; position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:20; align-items:center; justify-content:center; padding:24px; }
  .modal.activa{ display:flex; }
  .modal .box{ background:#fff; border-radius:18px; padding:22px; max-width:360px; width:100%; text-align:center; }
  .modal .ic{ width:58px; height:58px; border-radius:50%; color:#fff; font-size:28px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  .modal .ic.rojo{ background:#DC2626; } .modal .ic.azul{ background:#1E5AA0; }
  .modal h3{ margin:0 0 6px; font-size:18px; }
  .modal .fila{ display:flex; gap:10px; }
  .finwrap{ text-align:center; padding-top:40px; }
  .finwrap .big{ width:84px; height:84px; border-radius:50%; background:#15803D; color:#fff; font-size:44px; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
  .sug{ padding:12px 14px; border-bottom:1px solid #EDF1F7; display:flex; flex-direction:column; cursor:pointer; }
  .sug:active{ background:#F1F6FD; } .sug b{ font-size:15px; } .sug span{ font-size:12px; color:var(--mut); }
  #sugerencias{ background:#fff; border-radius:0 0 13px 13px; max-height:230px; overflow:auto; box-shadow:0 6px 16px rgba(15,23,42,.08); }
  #camSel{ display:none; background:#E3ECF6; border:1.5px solid #B9CFEA; border-radius:13px; padding:12px 14px; margin-top:10px; }
  #camSel b{ font-size:16px; color:var(--azul); } #camSel span{ font-size:13px; color:#334155; }
  #formNuevo{ display:none; margin-top:12px; }
</style>
</head>
<body>

<header>
  <div class="logo">CBN</div>
  <div class="t">Despachos</div>
  <div class="chip" id="chipHdr" style="display:none"><span id="chipCam"></span> → <span id="chipDes"></span></div>
</header>

<main>
  <section id="vInicio" class="vista activa">
    <h2>Nuevo despacho</h2>
    <button class="btn ghost" onclick="toggleNuevo()">➕ Registrar nuevo camión</button>
    <div class="card" id="formNuevo">
      <label for="nvPlaca">Placa</label><input id="nvPlaca" placeholder="Ej: 1234-ABC">
      <label for="nvChofer">Chofer</label><input id="nvChofer" placeholder="Nombre del chofer">
      <label for="nvTipo">Tipo de camión</label><input id="nvTipo" placeholder="Ej: Furgón, Cisterna…">
      <button class="btn azul sm mt" id="btnGuardarCam" onclick="guardarCamion()">Guardar camión</button>
    </div>
    <div class="card mt">
      <label for="inpBuscar">Camión</label>
      <input id="inpBuscar" oninput="filtrar()" placeholder="Escribe el número o la placa…" autocomplete="off">
      <div id="sugerencias"></div>
      <div id="camSel"></div>
      <label for="selDestino">Destino</label>
      <select id="selDestino"><option value="">Seleccione…</option></select>
    </div>
    <button class="btn azul mt" onclick="iniciar()">Iniciar despacho →</button>
  </section>

  <section id="vEscaneo" class="vista">
    <button class="btn negro" id="btnScan" onclick="toggleScan()">📷 Escanear palet</button>
    <div id="reader"></div>
    <button class="btn ghost" onclick="manual()">+ Escribir código manual</button>
    <div class="stat">
      <div class="n" id="contador">0</div>
      <div><div class="l">Palets escaneados</div><div class="s">Se enviarán todos al despachar</div></div>
    </div>
    <div class="hdr">PALETS ESCANEADOS</div>
    <div id="lista"></div>
    <div class="barra"><button class="btn azul" onclick="revisar()">Revisar y enviar →</button></div>
  </section>

  <section id="vResumen" class="vista">
    <h2>Resumen del despacho</h2>
    <div class="card">
      <div class="rrow"><span>Camión</span><b id="rCam"></b></div>
      <div class="rrow"><span>Chofer</span><b id="rCho"></b></div>
      <div class="rrow"><span>Tipo</span><b id="rTip"></b></div>
      <div class="rrow"><span>Destino</span><b id="rDes"></b></div>
      <div class="rrow" style="border:none"><span>Total de palets</span><b id="rTot"></b></div>
    </div>
    <div class="ok">✓ Sin palets duplicados — listo para enviar</div>
    <div class="hdr">PALETS</div>
    <div class="card" id="rLista" style="padding:0"></div>
    <div class="barra"><button class="btn verde" id="btnEnviar" onclick="enviar()">✈ Enviar despacho</button></div>
  </section>

  <section id="vFin" class="vista">
    <div class="finwrap">
      <div class="big">✓</div>
      <h2>Despacho enviado</h2>
      <p style="color:var(--mut)" id="finMsg"></p>
      <button class="btn azul mt" onclick="nuevo()">Nuevo despacho</button>
    </div>
  </section>
</main>

<!-- Confirmar agregar palet -->
<div class="modal" id="modalAdd">
  <div class="box">
    <div class="ic azul">▦</div>
    <h3 style="color:#1E5AA0">Palet leído</h3>
    <p style="margin:0 0 18px;color:#334155;font-size:16px">PALETA: <b id="addCod" style="font-family:monospace;font-size:18px;color:#0F172A"></b></p>
    <div class="fila">
      <button class="btn gris" onclick="cancelarAdd()">Cancelar</button>
      <button class="btn verde" onclick="confirmarAdd()">Agregar</button>
    </div>
  </div>
</div>

<!-- Alerta de duplicado -->
<div class="modal" id="modal">
  <div class="box">
    <div class="ic rojo">!</div>
    <h3 id="dupT" style="color:#991B1B">Palet duplicado</h3>
    <p id="dupM" style="margin:0 0 18px;color:#B91C1C;font-size:14px;line-height:1.5"></p>
    <button class="btn azul" onclick="cerrarDup()">Entendido</button>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  /* ====== URL del backend (Apps Script) ====== */
  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbxb-PiJUXv1a-c_SRKa9BMMJE1fTE4SAdgSZHV2z3uTv-QX6emldIkLbazUquKmIhVxuw/exec";
  /* =========================================== */

  const $ = (id) => document.getElementById(id);
  let camiones = [];
  let estado = { camion:"", chofer:"", tipo:"", destino:"", codigos:[] };
  let html5qr = null, escaneando = false;
  let esperando = false;             // true mientras hay un modal abierto tras un escaneo
  let codPendiente = "";             // palet leído esperando confirmación
  let ultimo = { code:"", t:0 };     // para ignorar la misma lectura al seguir enfocando

  function mostrar(id){
    document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa'));
    $(id).classList.add('activa');
    $('chipHdr').style.display = (id === 'vEscaneo' || id === 'vResumen') ? 'block' : 'none';
    window.scrollTo(0,0);
  }
  function vibrar(ms){ if(navigator.vibrate) navigator.vibrate(ms); }

  async function cargarListas(){
    if(!BACKEND_URL) return;
    try{
      const r = await fetch(BACKEND_URL); const d = await r.json();
      camiones = d.camiones || [];
      $('selDestino').innerHTML = '<option value="">Seleccione…</option>' + (d.destinos || []).map(x => `<option>${x}</option>`).join('');
    }catch(e){}
  }

  /* ---- buscador de camión ---- */
  function filtrar(){
    const q = $('inpBuscar').value.trim().toLowerCase(); const cont = $('sugerencias');
    if(!q){ cont.innerHTML = ''; return; }
    const m = camiones.filter(c => c.placa.toLowerCase().includes(q) || (c.chofer||'').toLowerCase().includes(q)).slice(0, 10);
    cont.innerHTML = m.length
      ? m.map(c => `<div class="sug" onclick="elegirCam('${c.placa.replace(/'/g,"\\'")}')"><b>${c.placa}</b><span>${c.chofer||'-'}${c.tipo? ' · '+c.tipo : ''}</span></div>`).join('')
      : '<div class="sug"><span>Sin coincidencias</span></div>';
  }
  function elegirCam(placa){
    const c = camiones.find(x => x.placa === placa); if(!c) return;
    estado.camion = c.placa; estado.chofer = c.chofer || ''; estado.tipo = c.tipo || '';
    $('inpBuscar').value = c.placa; $('sugerencias').innerHTML = '';
    $('camSel').style.display = 'block';
    $('camSel').innerHTML = `<b>${c.placa}</b><br><span>Chofer: ${c.chofer||'-'} · Tipo: ${c.tipo||'-'}</span>`;
  }

  /* ---- registrar camión ---- */
  function toggleNuevo(){ const f = $('formNuevo'); f.style.display = f.style.display === 'block' ? 'none' : 'block'; }
  async function guardarCamion(){
    const placa = $('nvPlaca').value.trim(), chofer = $('nvChofer').value.trim(), tipo = $('nvTipo').value.trim();
    if(!placa){ alert('Escribe la placa.'); return; }
    const btn = $('btnGuardarCam'); btn.disabled = true; btn.textContent = 'Guardando…';
    try{
      const r = await fetch(BACKEND_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ accion:'nuevoCamion', placa, chofer, tipo }) });
      const d = await r.json();
      if(d.ok){ camiones.push({ placa:d.placa, chofer:d.chofer, tipo:d.tipo });
        $('nvPlaca').value=''; $('nvChofer').value=''; $('nvTipo').value=''; $('formNuevo').style.display='none';
        elegirCam(d.placa); alert('Camión registrado ✓');
      } else alert(d.error || 'No se pudo registrar.');
    }catch(e){ alert('Error de red: ' + e); }
    finally{ btn.disabled = false; btn.textContent = 'Guardar camión'; }
  }

  function iniciar(){
    estado.destino = $('selDestino').value;
    if(!estado.camion){ alert('Busca y elige un camión.'); return; }
    if(!estado.destino){ alert('Elige un destino.'); return; }
    estado.codigos = []; esperando = false; codPendiente = ''; ultimo = { code:"", t:0 };
    $('chipCam').textContent = estado.camion; $('chipDes').textContent = estado.destino;
    render(); mostrar('vEscaneo');
  }

  /* ---- escáner ---- */
  async function toggleScan(){
    if(escaneando){ await pararScan(); return; }
    if(typeof Html5Qrcode === 'undefined'){ alert('No se cargó el lector. Revisa tu internet o usa "Escribir código manual".'); return; }
    $('reader').style.display = 'block';
    const F = Html5QrcodeSupportedFormats;
    const formats = [F.CODE_128, F.CODE_39, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.ITF, F.QR_CODE];
    html5qr = new Html5Qrcode("reader", { formatsToSupport: formats, verbose:false });
    try{
      await html5qr.start({ facingMode:"environment" }, { fps:10, qrbox:{ width:270, height:170 } }, onScan, () => {});
      escaneando = true; $('btnScan').textContent = '■ Detener cámara';
    }catch(e){ $('reader').style.display='none'; alert('No se pudo abrir la cámara: ' + e); }
  }
  async function pararScan(){
    if(html5qr){ try{ await html5qr.stop(); await html5qr.clear(); }catch(e){} }
    escaneando = false; esperando = false; $('reader').style.display='none'; $('btnScan').textContent = '📷 Escanear palet';
  }
  function reanudar(){ esperando = false; if(html5qr && escaneando){ try{ html5qr.resume(); }catch(e){} } }

  async function onScan(code){
    code = (code || '').trim(); if(!code) return;
    if(esperando) return;                                   // ya hay un modal abierto
    const ahora = Date.now();
    if(code === ultimo.code && ahora - ultimo.t < 2500) return;   // mismo palet al seguir enfocando: ignorar
    ultimo = { code: code, t: ahora };
    esperando = true;
    try{ if(html5qr && escaneando) html5qr.pause(true); }catch(e){}   // congela la cámara mientras decides

    // ¿duplicado en este despacho?
    if(estado.codigos.includes(code)){ mostrarDup('Palet duplicado', 'El palet ' + code + ' ya está en este despacho.'); return; }
    // ¿duplicado histórico (otro camión/fecha)?
    if(BACKEND_URL){
      try{
        const r = await fetch(BACKEND_URL + '?codigo=' + encodeURIComponent(code));
        const d = await r.json();
        if(d.usado){ mostrarDup('Palet ya despachado', 'El palet ' + code + ' ya fue enviado en el ' + d.camion + ' el ' + d.fecha + '.'); return; }
      }catch(e){}
    }
    // ok → pedir confirmación
    codPendiente = code; $('addCod').textContent = code; $('modalAdd').classList.add('activa'); vibrar(60);
  }

  function confirmarAdd(){
    if(codPendiente && !estado.codigos.includes(codPendiente)){ estado.codigos.push(codPendiente); render(); }
    codPendiente = ''; $('modalAdd').classList.remove('activa'); vibrar(120); reanudar();
  }
  function cancelarAdd(){ codPendiente = ''; $('modalAdd').classList.remove('activa'); reanudar(); }

  function mostrarDup(t,m){ $('dupT').textContent = t; $('dupM').textContent = m; $('modal').classList.add('activa'); vibrar([80,60,80]); }
  function cerrarDup(){ $('modal').classList.remove('activa'); reanudar(); }

  function render(){
    $('contador').textContent = estado.codigos.length;
    $('lista').innerHTML = estado.codigos.map((c,i) =>
      `<div class="item"><div class="badge">${i+1}</div><div class="cod">${c}</div><button class="x" onclick="quitar(${i})">✕</button></div>`
    ).reverse().join('');
  }
  function quitar(i){ estado.codigos.splice(i,1); render(); }
  function manual(){ const c = prompt('Código del palet:'); if(c){ onScan(c.trim()); } }

  async function revisar(){
    if(!estado.codigos.length){ alert('No hay palets escaneados.'); return; }
    await pararScan();
    $('rCam').textContent = estado.camion; $('rCho').textContent = estado.chofer || '-';
    $('rTip').textContent = estado.tipo || '-'; $('rDes').textContent = estado.destino;
    $('rTot').textContent = estado.codigos.length;
    $('rLista').innerHTML = estado.codigos.map((c,i) => `<div class="rrow"><span>Palet ${i+1}</span><b>${c}</b></div>`).join('');
    mostrar('vResumen');
  }

  async function enviar(){
    if(!BACKEND_URL){ alert('Falta configurar la URL del backend.'); return; }
    const btn = $('btnEnviar'); btn.disabled = true; btn.textContent = 'Enviando…';
    try{
      const r = await fetch(BACKEND_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ camion:estado.camion, destino:estado.destino, chofer:estado.chofer, tipo:estado.tipo, codigos:estado.codigos }) });
      const d = await r.json();
      if(d.ok){ $('finMsg').textContent = d.total_codigos + ' palets enviados y guardados.'; mostrar('vFin'); }
      else mostrarDup('No se pudo enviar', d.error || 'Error desconocido');
    }catch(e){ alert('Error de red: ' + e); }
    finally{ btn.disabled = false; btn.textContent = '✈ Enviar despacho'; }
  }

  function nuevo(){
    estado = { camion:"", chofer:"", tipo:"", destino:"", codigos:[] };
    esperando = false; codPendiente = ''; ultimo = { code:"", t:0 };
    $('inpBuscar').value=''; $('sugerencias').innerHTML=''; $('camSel').style.display='none'; $('selDestino').value='';
    mostrar('vInicio');
  }

  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
  cargarListas();
</script>
</body>
</html>
